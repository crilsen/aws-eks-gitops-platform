# App of Apps root (ADR: platform and workloads are separated under gitops/applications).
#
# Apply after Argo CD is installed:
#   kubectl apply -f gitops/bootstrap/root-app.yaml
#
# The root Application syncs gitops/applications recursively, creating the child
# Applications (platform and workloads). Child sync-waves order platform before
# workloads.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/crilsen/aws-eks-gitops-platform.git
    # Branch strategy: dev for now; switch to main when promotion is established.
    targetRevision: dev
    path: gitops/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
