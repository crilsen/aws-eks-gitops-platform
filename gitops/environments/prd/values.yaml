# prd environment values for application/helm.
# Promotion is PR-gated; update image.tag through a reviewed change, then sync.
image:
  registry: ghcr.io
  repository: crilsen/aws-eks-gitops-platform
  tag: "" # set by the promotion PR to a validated commit SHA

env:
  APP_VERSION: prd

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # No certificate-arn: the controller discovers the ACM certificate for the host.
  hosts:
    - host: app.crilsen.com
      paths:
        - path: /
          pathType: Prefix
